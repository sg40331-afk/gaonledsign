<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">가온전광판 제작시설과 장비 이미지</title>
  <desc id="desc">실사 장비 사진을 참고해 만든 전광판 제작실, 대형 프린터, CNC 장비, LED 모듈 보관 랙 이미지</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.52" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdd3df"/>
      <stop offset="0.55" stop-color="#e9f0f4"/>
      <stop offset="1" stop-color="#a3bdca"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfd"/>
      <stop offset="0.48" stop-color="#cfd9e2"/>
      <stop offset="1" stop-color="#8192a0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17314a"/>
      <stop offset="1" stop-color="#071a2c"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b7ff"/>
      <stop offset="0.52" stop-color="#1869ff"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#062033" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#0b2033"/>
      <circle cx="4" cy="4" r="1.2" fill="#1e9bff" opacity=".65"/>
      <circle cx="13" cy="13" r="1.1" fill="#ff8b38" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="0" fill="url(#room)"/>
